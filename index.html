<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101614">
<title>水影笺 · 把千里江山搅进水里</title>
<link rel="stylesheet" href="./css/main.css?v=1.7">
<link rel="stylesheet" href="./fonts/wenkai.css?v=1.7">
</head>
<body>

<!-- 页面水印（衬底，营造卷轴感） -->
<div id="watermark" aria-hidden="true">水影笺</div>

<div id="stage">
  <!-- 顶部留空：让位给容器状态栏 / 返回 / 分享胶囊 -->

  <main id="poolRow">
    <div id="brandStrip" aria-hidden="false">
      <span class="brand-dot"></span>
      <span class="brand-vert">水影笺</span>
      <span class="brand-sub-vert">以水为纸 · 滴墨成笺</span>
      <button id="galleryBtn" title="陈列室">藏</button>
    </div>

    <div id="poolWrap">
      <canvas id="pool"></canvas>
      <div id="poolCorners" aria-hidden="true"></div>
      <div id="hint">点一点 · 滴墨　　划一划 · 吹墨　　按住 · 渗墨</div>

      <!-- 主题切换：垂在池沿的五枚签条 -->
      <div id="themeSwitch">
        <button class="theme-tab active" data-theme="qinglv"><i></i>青绿</button>
        <button class="theme-tab" data-theme="shui"><i></i>松烟</button>
        <button class="theme-tab" data-theme="dunhuang"><i></i>敦煌</button>
        <button class="theme-tab" data-theme="ruyao"><i></i>汝窑</button>
        <button class="theme-tab" data-theme="zhongqiu"><i></i>中秋</button>
      </div>
    </div>
  </main>

  <footer id="dock">
    <div class="dock-label"><span>择 墨</span></div>
    <div id="palette"></div>
    <div id="tools">
      <div class="tool-group">
        <button class="tool-btn" data-pattern="yun">云纹</button>
        <button class="tool-btn" data-pattern="lang">浪纹</button>
        <button class="tool-btn" data-pattern="xuan">漩涡</button>
      </div>
      <div class="tool-group">
        <button class="tool-btn ghost" id="clearBtn">清池</button>
        <button class="cta" id="printBtn">覆纸<br>拓印</button>
      </div>
    </div>
  </footer>
</div>

<div id="printOverlay" class="hidden">
  <div id="sheetCaption"></div>
  <div id="modeSeg">
    <button data-mode="full" class="active">成笺</button>
    <button data-mode="pure">素笺</button>
  </div>
  <div id="paperSheet"><canvas id="paperCanvas"></canvas></div>
  <div id="resultBar" class="hidden">
    <button class="tool-btn ghost" id="againBtn">再拓一张</button>
    <button class="tool-btn" id="collectBtn">收入陈列室</button>
    <button class="cta" id="saveBtn">保存图片</button>
  </div>
  <div id="sealRow">署名印 · <span id="sealLabel">水影笺印</span>
    <button class="seal-edit" id="sealEdit">刻印</button>
  </div>
  <div id="shareCard" class="hidden">
    <div class="share-title" id="shareTitle"></div>
    <div class="share-body" id="shareBody"></div>
    <div class="share-tags" id="shareTags"></div>
    <div class="share-actions">
      <button class="cta cta-mini" id="postBtn">发笔记</button>
      <button class="tool-btn small" id="shareShuffle">换一版</button>
    </div>
    <div class="share-hint">长按选中上方文字 · 也可复制去发笔记</div>
  </div>
</div>

<div id="toast"></div>

<div id="sealModal" class="hidden">
  <div class="seal-box">
    <div class="seal-modal-title">刻一枚署名印</div>
    <input id="sealInput" maxlength="3" placeholder="最多 3 个字" autocomplete="off">
    <div class="seal-modal-hint">留空则用默认「水影笺印」；印面会自动排版</div>
    <div class="seal-modal-actions">
      <button class="tool-btn small ghost" id="sealCancel">取消</button>
      <button class="cta cta-mini" id="sealSave">刻好</button>
    </div>
  </div>
</div>

<script src="./js/palette.js?v=2.1"></script>
<script src="./js/fluid.js?v=2.1"></script>
<script src="./js/patterns.js?v=2.1"></script>
<script src="./js/rubbing.js?v=2.1"></script>
<script src="./js/mind.js?v=2.1"></script>
<script src="./js/gallery.js?v=2.1"></script>
<script src="./js/main.js?v=2.1"></script>
</body>
</html>
